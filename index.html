<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Word Char Words Count</h1>
    <textarea name="" id="textarea"></textarea>
    <p>wordCount :<span id="wordCount"> 0</span></p>
    <p>charCount :<span  id="charCount"> 0</span></p>
    <p>remaining words(out of 5000) :<span id="remaining">5000</span></p>
    <!-- <p>balance: <span id="balance">100</span></p> -->
    
    <script>
      let textarea = document.getElementById('textarea')
      textarea.addEventListener("input", (e) => {
        e.preventDefault()
        let total = textarea.value.length
        console.log(total)
        let remaining = document.getElementById("remaining");
        let words = 5000;
        let colabwords = words - total
        remaining.innerHTML = colabwords
        let charCount = document.getElementById("charCount");
        charCount.innerHTML = total
        let numbers = textarea.value.split(" ").length
        let wordCount = document.getElementById("wordCount");
        wordCount.innerHTML = numbers
      });
    </script> 
  </body>
</html>
